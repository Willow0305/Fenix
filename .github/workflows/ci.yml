name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: fenix_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: 5432
      POSTGRES_USER: fenix_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Validate code and build
        run: npm run check

      - name: Start web and API smoke tests
        run: npm run smoke

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Query PostgreSQL
        run: >-
          docker compose exec -T postgres
          psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"
          --set ON_ERROR_STOP=1 --command "SELECT 1;"

      - name: Show PostgreSQL logs after failure
        if: failure()
        run: docker compose logs postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
