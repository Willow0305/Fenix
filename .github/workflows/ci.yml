name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fenix_ci:ci-only-password@127.0.0.1:5432/fenix_ci?schema=public
      POSTGRES_DB: fenix_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: 5432
      POSTGRES_USER: fenix_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

      - name: Validate code and build
        run: npm run check

      - name: Start web and API smoke tests
        run: npm run smoke

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait postgres redis

      - name: Apply migrations from an empty database
        run: npm run prisma:migrate:deploy

      - name: Confirm migration deploy is idempotent
        run: npm run prisma:migrate:deploy

      - name: Verify deployed database scope
        run: npm run prisma:migrate:verify

      - name: Verify physical schema parity
        run: npm run prisma:migrate:diff

      - name: Validate Phase 1 authentication, authorization and audit
        run: npm run test:phase1:integration

      - name: Validate Phase 2 sports vertical
        run: npm run test:phase2:integration

      - name: Validate Phase 3 Caixa Fenix vertical
        run: npm run test:phase3:integration

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs postgres redis mailpit

      - name: Stop local services
        if: always()
        run: docker compose down --volumes
